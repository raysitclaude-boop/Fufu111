# Place at .github/workflows/nightly.yml in the repo
name: Nightly data refresh
on:
  schedule: [{cron: "0 20 * * *"}]   # 04:00 HKT
  workflow_dispatch: {}
permissions: {contents: write}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install cryptography
      - run: python3 build/pull_notion.py
        env: {NOTION_TOKEN: "${{ secrets.NOTION_TOKEN }}"}
      - run: python3 build/encrypt_bundle.py
        env: {FIELD_PW: "${{ secrets.FIELD_PW }}"}
      - name: Commit refreshed bundle (raw JSON never committed)
        run: |
          rm -f data/*.json
          git config user.name bot && git config user.email bot@local
          git add data.enc && git commit -m "nightly data refresh" || echo "no change"
          git push
