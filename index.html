<!DOCTYPE html>
<html lang="en">
<head>

<style>
:root{--bg:#0f1720;--card:#1a2530;--line:#2a3947;--tx:#e8eef4;--dim:#8ba0b3;--acc:#4fc3f7;--ok:#66bb6a;--warn:#ffa726;--bad:#ef5350;--solo:#2a78d6;--collab:#c3c2b7;--g2:#34d17a}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,'Segoe UI',Roboto,sans-serif;padding-bottom:calc(64px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));z-index:5;display:flex;justify-content:space-between;align-items:center}
h1{font-size:17px}
#asof{font-size:11px;color:var(--dim)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);z-index:5;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--dim);padding:8px 0 6px;font-size:10px;cursor:pointer}
nav button.on{color:var(--acc)}
nav button span{display:block;font-size:18px}
main{padding:12px 14px;max-width:820px;margin:0 auto}
input[type=search],input[type=password]{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:15px;outline:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
.card h3{font-size:15px;margin-bottom:3px}
.dim{color:var(--dim);font-size:12.5px}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--dim);margin:2px 3px 0 0}
.tag.ok{color:var(--ok);border-color:var(--ok)}.tag.bad{color:var(--bad);border-color:var(--bad)}.tag.warn{color:var(--warn);border-color:var(--warn)}.tag.acc{color:var(--acc);border-color:var(--acc)}
.row{display:flex;justify-content:space-between;gap:8px;align-items:baseline}

.back{color:var(--acc);cursor:pointer;font-size:13px;margin-bottom:8px;display:inline-block}
.sys{border-left:3px solid var(--acc);padding-left:10px;margin:14px 0 4px;font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 2px}

.btn{display:inline-block;width:100%;padding:12px;border-radius:10px;border:0;background:var(--acc);color:#00222f;font-weight:700;font-size:15px;cursor:pointer;margin-top:8px}

.pend{border-left:3px solid var(--warn)}
.okline{color:var(--ok);font-size:12.5px}

.pmck{width:20px;height:20px;accent-color:var(--acc);flex:none;margin-top:2px}
.pmrow{display:flex;gap:10px;align-items:flex-start}
.pmrow>div{flex:1;min-width:0}
.selbar{position:sticky;top:calc(44px + env(safe-area-inset-top));z-index:4;background:var(--bg);padding:6px 0}
.grpcount{font-size:11.5px;color:var(--dim);font-weight:400}

.mtx td{white-space:nowrap;line-height:1.25;padding:4px 7px}.mtx td.hc{color:#ffd54f;font-weight:700}.mtx td.hp{color:var(--g2);font-weight:700}.mtx tr.totrow td{border-top:1px solid var(--line)}

<body>
<div id="gate">
  <h2>🧰 FUJI Field</h2>

<header><h1>🧰 FUJI Field</h1><div><span id="syncb" onclick="go('outbox')"></span><span id="asof"></span></div></header>
<main id="view"></main>
<nav>

<script>
let DB=null, ROLE='admin', route={p:'sites'}, PREV=null, siteFilter='All';
let fixTab='symptom', errMachine='goplus', errQuery='';
const CARD_L2={artifacts:['Artifacts'],'charging-pins':['Charging Pins'],bcr:['Barcode Reader'],cable:['Cable/Connector'],handswitch:['Hand Switch','Wireless Hand Switch'],'charging-plug':['Charging Plug'],'collimator-handle':['Collimator Handle'],bumper:['Bumper'],wifi:['Wifi'],'wl-pacs':['WL and PACS'],'uu-settings':['UU Settings','SU Settings']};
const $=id=>document.getElementById(id), V=()=>$('view');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ================= V5.10: Fix > By Symptom =================
// MERGE KEY (lowercased, trimmed, single-spaced raw symptom) -> canonical
// display name override. The merge key is case-insensitive so "Hand switch
// malfunction" and "hand switch malfunction" collapse into one entry; the
// DISPLAY name is normally the most-frequent original spelling seen among
// that entry's CM records (see symIndex()) — this map overrides that for a
// handful of raw spellings that are typos or a poor label ("Error SM10006 HD
// is full" -> "Hard Disk Full"), regardless of how often each was typed.
const SYM_ALIAS={
  'poor wifi conneciton':'Poor Wifi Connection',
  'inspection on scews':'Inspection on screws',
  'error sm10006 hd is full':'Hard Disk Full',
  'charging pins damaged':'Detector charging pins damaged',
};
// Not faults — shown in a separate collapsed "Service / admin" group. Keys
// here are MERGE KEYS (lowercased raw), matched against a symptom's key —
// never its (possibly differently-cased) display name.
const SYM_ADMIN=new Set(['inspection on screws','screws check','installation','detector installation',
  'update software','return claimed panel','detector claimed in tims','printer set up']);
// trim + collapse whitespace, no case change — the literal spelling as typed.
function symNorm(raw){ return String(raw||'').trim().replace(/\s+/g,' '); }
// merge key for a raw symptom string (pure, no alias, no DB context).
function symKey(raw){ return symNorm(raw).toLowerCase(); }
// canonSym(raw): the DISPLAY name for a raw symptom string. SYM_ALIAS wins
// outright; otherwise, once symIndex() has aggregated the bundle, this is the
// most-frequent original spelling for that merge key (so "Error 'A9'" keeps
// its exact casing/quoting when that is how it was actually typed). Before
// the index is built (or for a key the index has never seen), falls back to
// the literal text as given — never invents capitalization of its own.
function canonSym(raw){
  const norm=symNorm(raw); if(!norm)return '';
  const k=norm.toLowerCase();
  if(SYM_ALIAS[k])return SYM_ALIAS[k];
  if(SYM_IDX&&SYM_IDX.has(k))return SYM_IDX.get(k).name;
  return norm;
}
// isAdminSym: checks a MERGE KEY (or anything that lowercases to one) against
// SYM_ADMIN — always lowercases its input, so it works whether it's handed a
// raw string, a merge key, or (loosely) a display name.
function isAdminSym(nameOrKey){ return SYM_ADMIN.has(String(nameOrKey||'').toLowerCase()); }
// Machine family, for the Fix chips (and elsewhere a coarse grouping is needed).
function machFam(str){
  const s=String(str||'');
  if(/go\s*plus|^go$/i.test(s))return 'Go Plus';
  if(/nano/i.test(s))return 'Nano';
  if(/d-?evo|dr-id\s*1[28]/i.test(s))return 'D-evo';
  if(/smart/i.test(s))return 'FDR Smart';
  if(/^pc$|console|300cl|330cl/i.test(s))return 'Console/PC';
  if(/retrofit/i.test(s))return 'Retrofit';
  if(/mammo/i.test(s))return 'Mammo';
  if(/se lite/i.test(s))return 'SE Lite';
  return 'Other';
}
let symMach='All', symAllMach=false, symPageN=20, SYM_CUR=null, SYM_IDX=null, SYM_BY_NAME=null, SYM_UNTAGGED=0, MCODE_BY_CODE=null;

// ================= V4 config =================
const WORKER_URL='https://fuji-field-proxy.raysit-claude.workers.dev';
const WRITE_KEY_LS='fw_wkey', NAME_LS='fw_name', OUTBOX_LS='fw_outbox', VISITS_LS='fw_visits';
const ACTIVE=['Anson','Poon','Pong','Alan','Yoshida','Ivan','Ray','Joe','Eunice','Tai','Kenton','Tim'];
const RESULTS=['Completed','Completed with findings','Partial - follow-up needed','Not done - rescheduled'];
const PM_TYPES=['Scheduled PM','Ad-hoc PM','Safety/QA Test','Installation Check'];
const workerReady=()=>WORKER_URL.startsWith('https');
// ---- engineer name normalisation ----
// Field data spells the same person several ways: "Poon"/"poon", "Alan"/"Alan*"
// (the asterisk marks a note in the source sheet, not a different engineer).
// Everything downstream — grouping, ranking, KPI — must see ONE identity.
const ROSTER=['Anson','Poon','Pong','Alan','Yoshida','Ivan','Ray','Joe','Eunice','Tai','Kenton','Tim','Winnie','Cheryl','Dixon','Choi'];
const ROSTER_L={};ROSTER.forEach(n=>ROSTER_L[n.toLowerCase()]=n);
function canonName(n){
  const s=String(n||'').replace(/[*＊\s]+$/,'').replace(/^[*＊\s]+/,'').trim();
  if(!s)return '';
  return ROSTER_L[s.toLowerCase()]||s.charAt(0).toUpperCase()+s.slice(1).toLowerCase();
}
// v5.12: PM / CM multi-select options can be COMBINED names ("Ivan+Poon", "Ray+poon") — split every
// element on , ; / 、 + ＋ & whitespace and " and " (same rule as split_names() in pull_notion.py).
const NAME_SEP_RE=/(?:\s+and\s+|[,;\/、+＋&\s])+/i;
const canonList=a=>[...new Set((Array.isArray(a)?a:(a?[a]:[])).flatMap(e=>String(e==null?'':e).split(NAME_SEP_RE)).map(canonName).filter(Boolean))];

// Notion links: only ever emit https:// hrefs (Notion data must never produce a javascript: URL).
const notionLink=(u,cls)=>/^https:\/\/[^\s"'<>]+$/.test(String(u||''))?`<a${cls?` class="${cls}"`:''} href="${esc(u)}" target="_blank" rel="noopener">Open in Notion ↗</a>`:'';
// ---------- markdown renderer (headings / lists / tables / code / bold) ----------
function md(src){
  const lines=String(src||'').split('\n'); let out=[], i=0;
  const inline=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  while(i<lines.length){
    let l=lines[i];
    if(/^\|(.+)\|\s*$/.test(l)){                         // pipe table
      let rows=[];
      while(i<lines.length&&/^\|(.+)\|\s*$/.test(lines[i])){
        let cells=lines[i].trim().slice(1,-1).split('|').map(c=>c.trim());
        if(!cells.every(c=>/^-+$/.test(c))) rows.push(cells);
        i++;
      }
      out.push('<table>'+rows.map((r,ri)=>'<tr>'+r.map(c=>ri?`<td>${inline(c)}</td>`:`<th>${inline(c)}</th>`).join('')+'</tr>').join('')+'</table>');
      continue;
    }
    if(/^###\s+/.test(l)){out.push('<h3>'+inline(l.replace(/^###\s+/,''))+'</h3>');i++;continue;}
    if(/^##\s+/.test(l)){out.push('<h2>'+inline(l.replace(/^##\s+/,''))+'</h2>');i++;continue;}
    if(/^\s*[-*]\s+/.test(l)){
      let items=[];
      while(i<lines.length&&/^\s*[-*]\s+/.test(lines[i])){items.push('<li>'+inline(lines[i].replace(/^\s*[-*]\s+/,''))+'</li>');i++;}
      out.push('<ul>'+items.join('')+'</ul>');continue;
    }
    if(/^\s*\d+[\.\)]\s+/.test(l)){
      let items=[];
      while(i<lines.length&&/^\s*\d+[\.\)]\s+/.test(lines[i])){items.push('<li>'+inline(lines[i].replace(/^\s*\d+[\.\)]\s+/,''))+'</li>');i++;}
      out.push('<ol>'+items.join('')+'</ol>');continue;
    }
    if(l.trim()==='---'){out.push('<hr style="border:0;border-top:1px solid var(--line);margin:10px 0">');i++;continue;}
    if(l.trim()===''){i++;continue;}
    out.push('<p>'+inline(l)+'</p>');i++;
  }
  return out.join('');
}
function goBack(){ if(PREV){const t=PREV;PREV=null;go(t.p,t.arg)} else go('sites'); }

// ---------- crypto gate ----------
async function deriveKey(pw,salt){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
}
async function tryDecrypt(file,pw){
  const r=await fetch(file); if(!r.ok)throw new Error('fetch');
  const b=new Uint8Array(await r.arrayBuffer()), salt=b.slice(0,16), iv=b.slice(16,28), ct=b.slice(28);
  const key=await deriveKey(pw,salt);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);
  return JSON.parse(new TextDecoder().decode(pt));
}
async function unlock(){
  $('gerr').textContent='';
  const pw=$('pw').value;
  try{ DB=await tryDecrypt('data.enc',pw); }
  catch(e){
    try{ DB=await tryDecrypt('dataw.enc',pw); }
    catch(e2){ $('gerr').textContent='Wrong password (or data not reachable).'; return; }
  }
  if($('rem').checked) localStorage.setItem('fw_pw',pw);
  boot();
}
async function tryRemembered(){const pw=localStorage.getItem('fw_pw');if(!pw)return;$('pw').value=pw;$('rem').checked=true;await unlock();}
const APP_VER='v5.13';
// --- HA cluster names -------------------------------------------------------
// The official HA list has 6 clusters; Hong Kong East and Hong Kong West were
// merged into Hong Kong Island. Old bundles cached on a phone may still carry
// the retired names or short forms, so normalise at read time — that way the
// grouping is right immediately, without waiting for the nightly rebuild.
const SEC_UNKNOWN='— sector unknown —';
const SEC_ALIAS={
  'hk island':'Hong Kong Island','hong kong east':'Hong Kong Island',
  'hong kong west':'Hong Kong Island','hk east':'Hong Kong Island',
  'hk west':'Hong Kong Island','hong kong island':'Hong Kong Island',
  'kowloon central':'Kowloon Central','kln central':'Kowloon Central',
  'kowloon east':'Kowloon East','kln east':'Kowloon East',
  'kowloon west':'Kowloon West','kln west':'Kowloon West',
  'nt east':'New Territories East','new territories east':'New Territories East',
  'nt west':'New Territories West','new territories west':'New Territories West'
};
function SECTOR(v){
  const k=String(v||'').trim().toLowerCase();
  if(!k) return SEC_UNKNOWN;
  return SEC_ALIAS[k]||String(v).trim();
}

// Hospital abbreviations — so searching "QEH", "PYNEH", "PWH"… finds the site.
// [name-fragment (lowercase), abbreviation]. First match is shown on the card.
const SITE_ABBR=[
  ['pamela youde','PYNEH'],['queen elizabeth','QEH'],['queen mary','QMH'],['prince of wales','PWH'],
  ['lai king','PMH-LKB'],['princess margaret','PMH'],['kwong wah','KWH'],
  ['united christian nethersole','UCN'],['united christian','UCH'],['tuen mun hospital','TMH'],
  ['tuen mun medlab','TM Medlab'],['north district','NDH'],['alice ho miu ling','AHNH'],['alice homiu ling','AHNH'],
  ['tseung kwan o','TKOH'],['pok oi','POH'],['yan chai','YCH'],['kwai chung','KCH'],['caritas medical','CMC'],
  ['ruttonjee','RH'],['st john','SJH'],['st. john','SJH'],['tung wah eastern','TWEH'],
  ['tung wah hospital','TWH'],['tung wah group of hospitals (north point','TWGHs-NP'],['tung wah college','TWC'],
  ['grantham','GH'],['fung yiu king','FYKH'],['maclehose','MMRC'],['duchess of kent','DKCH'],
  ['kowloon hospital','KH'],['buddhist','HKBH'],["children's hospital",'HKCH'],['haven of hope','HHH'],
  ['heaven of hope','HHH'],['north lantau','NLTH'],['shatin hospital','ShH'],['tai po','TPH'],
  ['cheshire home shatin','CHShatin'],['cheshire home','CHK'],['cheshire home chung hom kok','CHK'],
  ['tin shui wai','TSWH'],['wong tai sin','WTSH'],['our lady of maryknoll','OLMH'],['lady of maryknoll','OLMH'],
  ['conde','CHCSJ'],['januário','CHCSJ'],['januario','CHCSJ'],['hong kong sanatorium','HKSH'],
  ['baptist','HKBH-P'],["st paul's",'SPH'],['adventist','HKAH']
];
function siteAbbr(name){
  const l=String(name||'').toLowerCase();
  return SITE_ABBR.filter(([k])=>l.includes(k)).map(([,a])=>a);

function boot(){

// ---------- Serial ----------
// v5.11: with nothing (or <3 characters) typed, show a landing dashboard built from DB.items.
const FAM_LBL={goplus:'Go Plus',nano:'Nano',smart:'FDR Smart',mammo:'Mammo',devo2:'D-evo 2 detector',devo3:'D-evo 3 detector',retrofit:'Retrofit',selite:'FDR SE Lite',console:'Console/PC',printer:'Printer',other:'Other'};
const FAM_MAIN=['goplus','nano','smart','mammo','devo2','devo3'], FAM_MINOR=['retrofit','selite','console','printer','other'];
// Model/type-only family (the v5.11 rules, unchanged) — first match wins.
function itemFamByModel(i){
  const m=(i.model||'').toLowerCase(), t=i.type||'';
  if(/go\s*(\+|plus)/.test(m)&&!/flex/.test(m))return 'goplus';
  if(/nano/.test(m)&&t!=='Detector/Panel')return 'nano';
  if(/fdr\s*smart|fgxr/.test(m))return 'smart';
  if(/mammo|amulet/.test(m)&&t!=='Console/PC')return 'mammo';
  if(/d-?evo\s*2|dr-id\s*121/.test(m))return 'devo2';
  if(/d-?evo\s*3|dr-id\s*18/.test(m))return 'devo3';
  if(/retrofit/.test(m))return 'retrofit';
  if(t==='Console/PC')return 'console';
  if(t==='Printer'||/drypix/.test(m))return 'printer';
  return 'other';
}
// What the SERIAL NUMBER says. Verified on 684 serials with official PM model names: ^MQ Go Plus 57/57,
// ^DX FDR Smart 32/32, ^(FH|HF|VF|VX|KX)\d FDR SE Lite 44/44, PC serials 168/168 (all 'high').
// 'med' = detectors only: 8 digits, 4th digit 2 → D-evo 3 (~96%), 5 → D-evo 2 or Nano. It applies only where a
// detector serial is plausible (see sn8applies) — never to printers, PCs, Mammo, Retrofit or Nano machines.
// `i` (optional) supplies model/type for those exemptions. NOTE a PC-style serial is only a HINT: Retrofit, FDR Smart
// and Amulet systems are recorded under their console PC serial, so it never reclassifies an item (see itemFam).
function sn8applies(i){
  const t=i.type||'', mdl=i.model||'';
  if(t==='Printer'||/drypix/i.test(mdl)||t==='Console/PC')return false;
  if(t==='Detector/Panel')return true;
  if(['devo2','devo3','goplus'].includes(itemFamByModel(i)))return true;    // goplus here = a non-MQ serial
  return !String(mdl).trim();                                              // blank model (type isn't Printer/Console/PC)
}
function snHint(sn,i){
  sn=String(sn||'').trim().toUpperCase();
  if(/^MQ/.test(sn))return {fam:'goplus',conf:'high',why:'serial starts MQ'};
  if(/^DX/.test(sn))return {fam:'smart',conf:'high',why:'serial starts DX'};
  if(/^(FH|HF|VF|VX|KX)\d/.test(sn))return {fam:'selite',conf:'high',why:'serial starts '+sn.slice(0,2)+' + digit'};
  if(/^(\dC[A-Z0-9]|CND|SGH)/.test(sn)&&sn.length>=9)return {fam:'console',conf:'high',why:'serial looks like a PC'};
  if(/^\d{8}$/.test(sn)&&(!i||sn8applies(i))){
    if(sn[3]==='2')return {fam:'devo3',conf:'med',why:'8 digits, 4th digit 2'};
    if(sn[3]==='5')return {fam:'devo2',alt:['devo2','nano'],conf:'med',why:'8 digits, 4th digit 5 — D-evo 2 or Nano'};
  }
  return null;
}
// Model families a DX / SE-Lite serial may overrule: unknown ('other'/blank) or a detector family. Never Retrofit / Mammo /
// Console / Printer / Smart (Retrofit & Amulet systems carry console-PC serials).
const SN_OVERRIDABLE=['other','goplus','nano','devo2','devo3'];
// One family per item. MQ is absolute; DX / SE prefixes override only SN_OVERRIDABLE models; a PC prefix never overrides.
function itemFam(i){
  const sn=String(i.sn||'').trim().toUpperCase();
  const h=snHint(sn,i);
  if(h&&h.fam==='goplus'&&h.conf==='high')return 'goplus';                  // 1. every Go Plus serial starts MQ
  const mf=itemFamByModel(i);
  if(h&&h.conf==='high'&&(h.fam==='smart'||h.fam==='selite')&&SN_OVERRIDABLE.includes(mf))return h.fam;   // 3./4.
  if(mf==='goplus'){                                  // 2. tagged Go Plus but the serial isn't MQ → not a Go Plus:
    const fm=itemFamByModel({...i,model:''});         //    classify as if the model were blank (+ the detector hint)
    return fm==='other'&&h&&h.conf==='med'?h.fam:fm;
  }
  return mf;
}
const DQ_LBL={nanodet:'Machine Type “Nano” but Asset Type Detector/Panel (not counted as Nano machines)',devomach:'D-evo detectors tagged Asset Type Machine / Console',nomodel:'Active items with a blank model',snmis:'Serial pattern disagrees with Machine Type'};
// Active items whose serial pattern disagrees with what the model/type alone would give. High confidence first.
// Never listed when the hint agrees (Console/PC type + PC serial, SE Lite model + SE prefix, d4=5 with D-evo 2 / Nano / Go Flex).
// A PC-style serial is listed only against a detector/imaging family a PC can't be. A Go Plus tag on a non-MQ serial is
// always listed (every Go Plus serial starts MQ), with or without a detector hint.
function serialMismatch(act){
  const out=[];
  act.forEach(i=>{
    const sn=String(i.sn||'').trim().toUpperCase(), h=snHint(sn,i), mdl=i.model||'';
    let mf=itemFamByModel(i);
    if(/se\s*lite/i.test(mdl))mf='selite'; else if(mf==='other'&&/nano/i.test(mdl))mf='nano';   // correctly tagged ones agree
    if(h){
      let bad;
      if(h.fam==='console')bad=['goplus','nano','devo2','devo3','selite'].includes(mf);
      else bad=!(h.alt||[h.fam]).includes(mf)&&!(h.fam==='devo2'&&/flex/i.test(mdl));
      if(bad)out.push({i,fam:h.fam,conf:h.conf,why:h.why});
    }
    else if(mf==='goplus')out.push({i,fam:null,conf:'med',why:'no MQ prefix — every Go Plus serial starts MQ'});
  });
  return out.sort((a,b)=>(a.conf==='high'?0:1)-(b.conf==='high'?0:1)||String(a.i.sn).localeCompare(String(b.i.sn)));
}
function serialDQ(){
  const act=activeItems();
  return {
    nanodet:act.filter(i=>/nano/i.test(i.model||'')&&i.type==='Detector/Panel'),
    devomach:act.filter(i=>['devo2','devo3'].includes(itemFam(i))&&['Machine','Console/PC'].includes(i.type||'')),
    nomodel:act.filter(i=>!String(i.model||'').trim()),
    snmis:serialMismatch(act).map(x=>x.i)
  };
}
let serFam=null;
const bySiteSys=(a,b)=>String(a.site||'').localeCompare(String(b.site||''))||String(a.sysno||'').localeCompare(String(b.sysno||''),undefined,{numeric:true})||String(a.sn).localeCompare(String(b.sn));
function serialDash(){
  const act=activeItems(), fam={};
  act.forEach(i=>{const f=itemFam(i);fam[f]=(fam[f]||0)+1});
  const sitesN=new Set(act.map(i=>i.site).filter(Boolean)).size;
  const kp=[[DB.items.length,'Total items'],[act.length,'Active'],[DB.items.filter(i=>i.status==='Retired').length,'Retired'],
    [DB.items.filter(i=>i.status==='Not confirmed').length,'Not confirmed'],[sitesN,'Sites'],[act.filter(i=>!i.sysno).length,'Active, no System #']];
  const tile=(k,dim)=>`<div class="kpi click" data-fam="${k}" style="${dim?'opacity:.72;':''}" onclick="serFam='${k}';serialSearch()"><div class="n${dim?'':' g'}">${fam[k]||0}</div><div class="l">${esc(FAM_LBL[k])}</div></div>`;
  const dq=serialDQ(), dqs=Object.keys(dq).filter(k=>dq[k].length);
  return `<div class="kpis" style="grid-template-columns:repeat(3,1fr)">${kp.map(([n,l])=>`<div class="kpi"><div class="n">${n}</div><div class="l">${esc(l)}</div></div>`).join('')}</div>
   <div class="sys">Active machines by family</div>
   <div class="kpis" style="grid-template-columns:repeat(3,1fr)">${FAM_MAIN.map(k=>tile(k,false)).join('')}</div>
   <div class="kpis" style="grid-template-columns:repeat(5,1fr)">${FAM_MINOR.map(k=>tile(k,true)).join('')}</div>
   ${dqs.length?`<div class="hint" style="margin-top:8px">Data quality: ${dqs.map(k=>`<span class="click" style="color:var(--warn);text-decoration:underline" data-dq="${k}" onclick="serFam='dq:${k}';serialSearch()">${dq[k].length} · ${esc(DQ_LBL[k])}</span>`).join(' &nbsp;|&nbsp; ')}</div>`:''}
   <details class="proc"><summary><span>How counted</span></summary><div class="body"><div class="hint">Only active items (status not Retired) are counted, each into exactly one family; the first rule that matches wins. Serial number first: MQ… is always a Go Plus. DX… (FDR Smart) and FH/HF/VF/VX/KX + digit (FDR SE Lite) decide the family when the model is blank, unknown or a detector model — they never overrule Retrofit, Mammo, Console/PC or printer models. A PC-style serial never changes the family (Retrofit, Smart and Amulet systems are recorded under their console PC serial); it is only flagged when a detector model carries one. An item tagged Go Plus whose serial does not start with MQ is NOT counted as a Go Plus — it is classed by its other details, and an 8-digit detector serial with 4th digit 2 counts as D-evo 3, 5 as D-evo 2. After that the model and asset type decide: Nano (not a bare detector), FDR Smart / FGXR, Mammo / Amulet (not a console), D-evo 2 (DR-ID 121), D-evo 3 (DR-ID 18xx), Retrofit, Console/PC, Printer, Other. Printers are never guessed from the serial.</div></div></details>
   <div class="hint">Search across ${DB.items.length} items above. The unit label is authoritative — report mismatches.</div>`;
}
function serialFamList(key){
  const dq=key.startsWith('dq:'), k=dq?key.slice(3):key;
  if(dq&&k==='snmis'){
    const mm=serialMismatch(activeItems());
    return `<span class="back" onclick="serFam=null;serialSearch()">← Dashboard</span>

function machFamOrder(){
  const counts={};
  DB.svc.forEach(s=>(s.mach||[]).forEach(m=>{const f=machFam(m);counts[f]=(counts[f]||0)+1;}));

// canonical symptom name -> {name, recs:[svc refs], admin:bool}, memoised once per data load
// Map: merge key -> canonical entry {name (DISPLAY), key, recs, admin}.
// DISPLAY = SYM_ALIAS override, else the most-frequent original raw spelling
// for that key (tie -> first seen). Both `counts` (key -> Map(spelling->n))
// and each per-key spelling Map preserve first-seen insertion order, so a
// strict ">" when tracking the running max already gives "first seen wins
// ties" for free — no separate tie-break pass needed.
function symIndex(){
  if(SYM_IDX)return SYM_IDX;
  const counts=new Map(), recsByKey=new Map(); let untagged=0;
  DB.svc.forEach(s=>{
    const raws=(s.sym||[]).map(symNorm).filter(Boolean);
    if(!raws.length){untagged++;return;}
    const keysThisRec=new Set();
    raws.forEach(spelling=>{
      const key=spelling.toLowerCase();
      if(!counts.has(key))counts.set(key,new Map());
      const cmap=counts.get(key);
      cmap.set(spelling,(cmap.get(spelling)||0)+1);
      keysThisRec.add(key);
    });
    keysThisRec.forEach(key=>{
      if(!recsByKey.has(key))recsByKey.set(key,[]);
      recsByKey.get(key).push(s);
    });
  });
  const idx=new Map(), byName=new Map();
  counts.forEach((cmap,key)=>{
    let name=SYM_ALIAS[key];
    if(!name){
      let best=null,bestN=-1;
      cmap.forEach((n,spelling)=>{ if(n>bestN){best=spelling;bestN=n;} });
      name=best;
    }
    const entry={name,key,recs:recsByKey.get(key)||[],admin:isAdminSym(key)};
    idx.set(key,entry); byName.set(name,entry);
  });
  SYM_UNTAGGED=untagged; SYM_IDX=idx; SYM_BY_NAME=byName;

}

function symEntryByName(name){

}

// --- Symptom detail page (route 'sym') ---
// Pull candidate error codes out of free text: an explicit "error X" / "X error"
// mention, or a bare code-shaped token (F5F, A9, 11231, SM10006…).
// Pull error-code-shaped tokens out of free text. A token is a WHOLE WORD —
// bounded by start/end of string, whitespace, a quote, or ordinary punctuation
// (never by '.' or '-', so "D-evo2" and "16.7"/"v16.4" stay single tokens and
// fail the shape check below, instead of splitting into a false "EVO2"/"16").
// It counts as a code when EITHER:
//   (a) 2-6 chars, has a digit, and matches /^[A-Z]{0,3}\d{1,5}[A-Z]?$/ (F5F,
//       A9, 11231, F76) — OR
//   (b) it's alphanumeric with a digit and the PRECEDING word is "error"
//       (case-insensitive) — this is the escape hatch for a code that's
//       longer than 6 chars once written out, e.g. "Error SM10006 HD is full".
const SYM_CODE_BOUND_RE=/^[\s'"“”‘’,;:()\[\]{}!?]+|[\s'"“”‘’,;:()\[\]{}!?]+$/g;
const SYM_CODE_SHAPE_RE=/^[A-Z]{0,3}\d{1,5}[A-Z]?$/;
function extractCodes(text){
  const words=String(text||'').split(/\s+/).map(w=>w.replace(SYM_CODE_BOUND_RE,''));
  const out=new Set();
  for(let i=0;i<words.length;i++){
    const core=words[i]; if(!core)continue;
    const up=core.toUpperCase();
    const alnumWithDigit=/^[A-Z0-9]+$/.test(up)&&/\d/.test(up);
    if(up.length>=2&&up.length<=6&&alnumWithDigit&&SYM_CODE_SHAPE_RE.test(up)){
      out.add(up);
    }else if(alnumWithDigit&&i>0&&words[i-1].toLowerCase()==='error'){
      out.add(up);
    }
  }
  return out;
}
function errHitsForCode(code){
  const exact=errHits(code.toLowerCase(),200).filter(h=>String(h.r[0]||'').trim().toUpperCase()===code);
  return exact.length?exact:errHits(code.toLowerCase(),10);
}

// ---------- Parts ----------
// v5.12: which machine families does a part apply to? Folded from the CM "Machines Types" of the
// tickets that used it (build_parts → p.machn {rawType:n}) through machFam(). The same rule is ported to
// Python (mach_fam / applies_to in pull_notion.py) to give the worker bundle its `fam` name list.
const PART_FAM_ORDER=['Go Plus','Nano','D-evo 2','D-evo 3','D-evo','FDR Smart','Mammo','Retrofit','Console/PC','SE Lite','Other'];
// Parts-only family: machFam() (which drives Fix and must not change) lumps D-evo 2 / 3 together and sends
// Amulet to Other. Ported to Python as part_fam() in pull_notion.py — keep identical (tests/part_types.json).
function partFam(raw){
  const s=String(raw||''), f=machFam(s);
  if(f==='D-evo'){
    if(/d-?evo\s*2|dr-id\s*121/i.test(s))return 'D-evo 2';
    if(/d-?evo\s*3|dr-id\s*18/i.test(s))return 'D-evo 3';
    return 'D-evo';
  }
  if(f==='Other'&&/mammo|amulet/i.test(s))return 'Mammo';
  return f;
}
function partFams(p){   // {family:count}; old admin bundles without machn fall back to p.mach with weight 1 each
  const o={};
  if(p.machn&&Object.keys(p.machn).length)Object.entries(p.machn).forEach(([k,v])=>{const f=partFam(k);o[f]=(o[f]||0)+v;});
  else (p.mach||[]).forEach(k=>{const f=partFam(k);o[f]=(o[f]||0)+1;});
  return o;
}
function partApplies(p){   // family names, count desc; worker bundles carry only `fam` (names, no counts)
  if(!p.machn&&!(p.mach&&p.mach.length))return Array.isArray(p.fam)?p.fam:[];
  const fm=partFams(p), thr=Math.max(1,0.2*(p.n||0));
  return Object.entries(fm).filter(([,c])=>c>=thr).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])).map(([k])=>k);
}
const famChips=p=>{const a=partApplies(p);return a.length?`<div>${a.map(x=>`<span class="tag ok">${esc(x)}</span>`).join('')}</div>`:'';};
function partRowW(p){  // worker view: name + P/N + applies-to family names only; no counts, no CM records
  return `<div class="card"><div class="row"><h3>${esc(p.name)}</h3>${p.pn?`<span class="tag acc">${esc(p.pn)}</span>`:''}</div>${famChips(p)}</div>`;
}
let partFamSel='All';
function parts(){
  const present=new Set();DB.parts.forEach(p=>partApplies(p).forEach(f=>present.add(f)));
  const fams=[...PART_FAM_ORDER.filter(f=>present.has(f)),...[...present].filter(f=>!PART_FAM_ORDER.includes(f)).sort()];
  if(partFamSel!=='All'&&!present.has(partFamSel))partFamSel='All';
  const chips=`<div class="chips">${['All',...fams].map(f=>`<button class="chip${partFamSel===f?' on':''}" onclick="partFamSel=${attr(f)};parts()">${esc(f)}</button>`).join('')}</div>`;
  const hint=ROLE==='worker'?`${DB.parts.length} parts · name &amp; part number.`:`Catalog built from ${DB.svc.filter(s=>s.parts&&s.parts.length).length} CM records that used parts — counts = times used in the field. Machine chips = families the part has been used on.`;
  V().innerHTML=`<input type=search id=q placeholder="Part name or P/N…" oninput="partsSearch()">${chips}
   <div class="hint">${hint}</div><div id=list></div>`;
  partsSearch();
}
function partsSearch(){
  const q=$('q').value.toLowerCase();
  const hit=DB.parts.filter(p=>(partFamSel==='All'||partApplies(p).includes(partFamSel))&&(p.name+' '+(p.pn||'')).toLowerCase().includes(q));

   ${relCards.length?`<div class="sys">Related troubleshooting cards</div>`+relCards.map(cardRow).join(''):''}
   <div class="sys">CM cases using this part (${rec.length})</div>

let pmTab='sched', pmMonth=null, pmRel=null, pmStF='All', pmGroup='pic', vPic='Mine', vSt='Open';
const PMTICK_LS='fw_pmtick';
// Month the monthly PM workflow began. Anything scheduled earlier is pre-workflow
// carry-over and is collapsed into a single "Backlog" chip. Change this one line
// if you ever want a different cut-off.
const PM_START='2026-06';
const PM_BACKLOG='Backlog';
// Which monthly schedule does a row belong to? Used by BOTH the PM tab and the
// monthly report so the two can never disagree.
//  - dated before the workflow started  -> Backlog (pre-workflow carry-over)
//  - otherwise                          -> the release month it was issued in
//    (schedule date is unreliable: the July + check-list CSVs ship it empty)
const MON3=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
// 'Jun 2026' -> '2026-06'. Bundles built before relm existed only carry the label.
function relToYM(rel){
  const m=MON3.indexOf(String(rel||'').slice(0,3));
  const y=String(rel||'').match(/\d{4}/);
  return (m<0||!y)?'':`${y[0]}-${String(m+1).padStart(2,'0')}`;
}
function pmBucket(x){
  const sd=(x.d||'').slice(0,7);
  if(sd&&sd<PM_START)return PM_BACKLOG;
  return x.relm||relToYM(x.rel)||sd||'(no date)';
}
// Statuses that mean "no work owed" — excluded from the to-do count.
// Includes the newer options seen in the monthly release files.
const NA_ST=['No Need','Not Required','Closed','No Contract','No Info','On Hold',
             'Replaced','Excluded','No Need but recorded in system','Cancelled','Canceled'];
const pmSel=new Set();
const attr=o=>esc(JSON.stringify(o)).replace(/'/g,'&#39;');
const getTicks=()=>JSON.parse(localStorage.getItem(PMTICK_LS)||'{}');
const setTicks=o=>localStorage.setItem(PMTICK_LS,JSON.stringify(o));
function pm(){
  V().innerHTML=`<div class="subtabs">
     <button class="${pmTab==='sched'?'on':''}" onclick="pmTab='sched';pm()">🗂 Schedule</button>
     <button class="${pmTab==='visits'?'on':''}" onclick="pmTab='visits';pm()">📝 Visit Log</button>
   </div><div id=pmbody></div>`;
  ({sched:pmSched,visits:pmVisits})[pmTab]();
}
// --- Schedule (from nightly bundle, tick = mark Completed in Notion) ---
// A status like "Jul Schedule" names the month the job is scheduled FOR.
// Inside that same month it means "still to do"; inside an EARLIER month it
// means the job was deferred — e.g. the June check-list marks 59 rows
// "Jul Schedule" because they rolled into the July schedule, where they already
// appear. Those must not count as June outstanding, or June is double-charged.
// Returns the target 'YYYY-MM', or '' if the status isn't a month/year schedule.
function schedTargetYM(st,refYM){
  const s=String(st||'').trim();
  const yr=s.match(/^(\d{4})\s+Schedule$/i);
  if(yr)return `${yr[1]}-01`;                       // "2027 Schedule"
  const mo=s.match(/^([A-Za-z]{3,9})\s+Schedule$/i);
  if(!mo||!/^\d{4}-\d{2}$/.test(refYM||''))return '';
  const idx=MON3.indexOf(mo[1].slice(0,3).replace(/^./,c=>c.toUpperCase()));
  if(idx<0)return '';
  const [by,bm]=refYM.split('-').map(Number);
  const y=(idx+1)<bm?by+1:by;                       // earlier month name ⇒ next year
  return `${y}-${String(idx+1).padStart(2,'0')}`;
}
const pmCat=st=>st==='Completed'?'Completed':(NA_ST.includes(st)?'N/A':'Outstanding');
// Bucket-aware category: adds 'Moved' for jobs deferred to another month.
function pmCatOf(x){
  if(x.st==='Completed')return 'Completed';
  if(NA_ST.includes(x.st))return 'N/A';
  const b=pmBucket(x);
  const ref=/^\d{4}-\d{2}$/.test(b)?b:(x.d||'').slice(0,7);
  const t=schedTargetYM(x.st,ref);
  return (t&&ref&&t!==ref)?'Moved':'Outstanding';
}
const pmMovedTo=x=>{
  const b=pmBucket(x), ref=/^\d{4}-\d{2}$/.test(b)?b:(x.d||'').slice(0,7);
  const t=schedTargetYM(x.st,ref);
  return (t&&ref&&t!==ref)?t:'';
};
// Live Visit Log completions, keyed by serial → [dates]. A PM logged through the
// Visit Log (instead of a schedule tick) otherwise never shows as done here.
const VISIT_CLOSE_DAYS=120;
function visitDoneIndex(){
  const c=getVisits(); const idx={};
  (c&&c.visits||[]).forEach(v=>{
    if(!v.result||!/^Completed/i.test(v.result))return;
    const sn=String(v.sn||'').trim().toUpperCase(); if(!sn||!v.d)return;
    (idx[sn]=idx[sn]||[]).push(v.d);
  });
  return idx;
}
function matchVisit(idx,x){
  const sn=String(x.sn||'').trim().toUpperCase(); if(!sn||!idx[sn])return null;
  return idx[sn].find(vd=>{
    if(!x.d)return true;                       // undated schedule row — any completion counts
    if(vd<x.d)return false;                    // completed before it was due → different cycle
    return (new Date(vd)-new Date(x.d))/86400e3<=VISIT_CLOSE_DAYS;
  })||null;
}
function pmRows(){
  const tk=getTicks(); let changed=false;
  const idx=visitDoneIndex();
  const rows=DB.pm.map(x=>{
    if(x.id&&tk[x.id]){
      if(x.st==='Completed'){delete tk[x.id];changed=true;return x;}
      return {...x,st:'Completed',_pend:true};
    }
    if(x.st!=='Completed'&&pmCat(x.st)!=='N/A'){
      const vd=matchVisit(idx,x);
      if(vd)return {...x,st:'Completed',_viaVisit:vd};
    }
    return x;
  });
  if(changed)setTicks(tk);
  return rows;
}
function pmSched(){
  const rows=pmRows();
  // Category = the MONTHLY SCHEDULE a row belongs to (one bucket per release:
  // Jun 2026, Jul 2026, Aug 2026 …). Not the schedule date — the July and
  // check-list CSVs ship with that column empty. Pre-workflow carry-over
  // (dated before PM_START) collapses into one Backlog bucket.
  const prev=(()=>{const [y,m]=PM_START.split('-').map(Number);
    return m===1?`${y-1}-12`:`${y}-${String(m-1).padStart(2,'0')}`;})();
  const BACKLOG=PM_BACKLOG, bucket=pmBucket;
  const labelOf={};rows.forEach(x=>{const b=x.relm||relToYM(x.rel);if(b&&x.rel)labelOf[b]=x.rel;});
  const present=[...new Set(rows.map(bucket))];
  const cats=present.filter(b=>b!==BACKLOG&&b!=='(no date)').sort().reverse()
    .concat(present.includes(BACKLOG)?[BACKLOG]:[]).concat(present.includes('(no date)')?['(no date)']:[]);
  if(pmMonth===null||(pmMonth!=='All'&&!cats.includes(pmMonth))){
    const cur=new Date().toISOString().slice(0,7);
    pmMonth=cats.includes(cur)?cur:(cats[0]||'All');
  }
  const c=pmMonth;
  const catLabel=b=>b===BACKLOG?`📦 Backlog (≤${prev})`:(b==='All'?'All':(labelOf[b]?`📅 ${labelOf[b]}`:b));
  const inCat=x=>c==='All'||bucket(x)===c;
  // Status chips come from YOUR data ("Jun Schedule", "Outstanding", …), not invented buckets
  const stats=[...new Set(rows.filter(inCat).map(x=>x.st).filter(Boolean))]
    .sort((a,b)=>(/schedule/i.test(b)?1:0)-(/schedule/i.test(a)?1:0)||a.localeCompare(b));
  const flt=rows.filter(x=>inCat(x)&&(pmStF==='All'||x.st===pmStF));
  const groups={};
  const keyfn=x=>pmGroup==='pic'?(x.pic&&x.pic.length?x.pic:['(unassigned)']):
    (pmGroup==='site'?[x.site||'(no site)']:(pmGroup==='month'?[(x.d||'(no date)').slice(0,7)]:[x.st||'(no status)']));
  flt.forEach(x=>keyfn(x).forEach(k=>(groups[k]=groups[k]||[]).push(x)));
  const keys=Object.keys(groups).sort();
  const done=flt.filter(x=>x.st==='Completed').length;
  const viaV=flt.filter(x=>x._viaVisit).length;
  const na=flt.filter(x=>pmCatOf(x)==='N/A').length;
  const moved=flt.filter(x=>pmCatOf(x)==='Moved').length;
  const noId=flt.some(x=>!x.id);
  if(!getVisits())refreshVisits(true);   // pull live completions in the background
  const gicon={pic:'👤',site:'🏥',st:'🏷',month:'📅'}[pmGroup];
  $('pmbody').innerHTML=`
   <div class="chips">${[...cats,'All'].map(m=>`<button class="chip${c===m?' on':''}" onclick="pmMonth='${m}';pmStF='All';pmSel.clear();pm()">${esc(catLabel(m))}</button>`).join('')}</div>
   <div class="chips">${['All',...stats].map(s=>`<button class="chip${pmStF===s?' on':''}" onclick="pmStF='${s.replace(/'/g,"\\'")}';pmSel.clear();pm()">${esc(s)}</button>`).join('')}</div>
   <div class="chips"><span class="dim" style="align-self:center">Group by</span>${[['pic','👤 PIC'],['site','🏥 Hospital'],['st','🏷 Status'],['month','📅 Month']].map(([k,l])=>`<button class="chip${pmGroup===k?' on':''}" onclick="pmGroup='${k}';pm()">${l}</button>`).join('')}</div>
   ${pmGroup==='pic'&&flt.some(x=>x.picsrc==='check')?'<div class="hint">👤 Green PIC = actual engineer from the official check-list. Plain = pre-assigned on the schedule. ↺ marks a job that was reassigned.</div>':''}
   <div class="hint">${flt.length} rows · ${done} completed${viaV?' ('+viaV+' from Visit Log)':''}, ${flt.length-done-na-moved} still to do${moved?', '+moved+' moved to a later month':''}${na?', '+na+' n/a':''}. A tick marks the row <b>Completed</b> in Notion — use the Visit Log only when something abnormal was found.
     ${getVisits()?'':'<span style="color:var(--warn)">⚠ Visit Log not loaded on this device yet — tap ↻ in the Visit Log tab so completions logged there show here.</span>'}</div>
   ${c===BACKLOG?`<div class="hint">Rows scheduled before ${PM_START}, when the monthly PM workflow started — carried-forward work, grouped together instead of one chip per month.</div>`:''}
   ${noId?'<div class="hint" style="color:var(--warn)">⚠ Rows from an old data snapshot can’t be ticked yet — they will after the next nightly refresh.</div>':''}
   <div id=selbar class="selbar" style="display:none"><button class="btn" onclick="tickSelected()">✓ Mark selected as Completed (<span id=seln></span>)</button></div>
   ${keys.map(k=>{const g=groups[k],gd=g.filter(x=>x.st==='Completed').length;
     return `<div class="sys">${gicon} ${esc(k)} <span class="grpcount">· ${gd}/${g.length} done</span></div>`+g.map(pmSchedLine).join('');}).join('')||'<div class=dim style=margin-top:10px>No PM rows match.</div>'}`;
  updateSelbar();
}
function pmSchedLine(x){

  const st=cat==='Completed'?'ok':(cat==='Outstanding'?'bad':'warn');

   </div></div></div>`;

function selPM(id,on){if(on)pmSel.add(id);else pmSel.delete(id);updateSelbar();}

function tickPM(ids){
  const need=needIdentity();
  if(need==='setkey'||need==='setname'){$('pmbody').innerHTML=identityCard()+'<div class="hint">One-time setup — then tick again.</div>';return}
  if(need){alert(need);return}

}

// ---- outbox (offline write queue) ----
const getOutbox=()=>JSON.parse(localStorage.getItem(OUTBOX_LS)||'[]');
const setOutbox=a=>{localStorage.setItem(OUTBOX_LS,JSON.stringify(a));updateSyncBadge()};
function enqueue(method,path,payload,label){
  const box=getOutbox();
  box.push({uuid:uid(),method,path,payload,label,st:'queued',err:'',ts:new Date().toISOString()});
  setOutbox(box); flushOutbox();
}
let flushing=false;
// Statuses the Worker can return that are NOT the job's fault and must stay
// retryable. 401/403 is almost always a rotated WRITE_KEY: parking those as
// 'failed' silently strands every queued write on every phone until someone
// taps Retry by hand. 408/425/429 are transport/back-pressure.
const RETRYABLE=new Set([401,403,408,425,429]);
// The Worker returns these as 4xx errors, but they mean "your patch would change
// nothing" — a no-op, not a failure. Confirm the job instead of stranding it.
const NOOP_RE=/nothing to (update|record)/i;
const jobAgeMs=j=>Date.now()-new Date(j.ts).getTime();
async function flushOutbox(force){
  // navigator.onLine only says "an interface is attached" — on hospital Wi-Fi
  // behind a captive portal it reads true with no route out, and it can read
  // false on some Android builds while data works. Let a manual tap override.
  if(flushing||!workerReady()||(!force&&!navigator.onLine))return; flushing=true;
  try{
    let box=getOutbox();
    // Persist by MERGING into the live outbox, never by writing this (possibly stale) snapshot back:
    // jobs enqueued while a fetch was in flight must survive. Entries are matched on the immutable j.uuid.
    const persist=j=>{const cur=getOutbox();const k=cur.findIndex(x=>x.uuid===j.uuid);if(k>=0)cur[k]=j;setOutbox(cur);};
    for(const j of box.filter(x=>x.st!=='confirmed'&&!x.hold)){   // held jobs (out-of-date Worker) wait for an explicit Retry
      try{
        const r=await fetch(WORKER_URL+j.path,{method:j.method,
          headers:{'Content-Type':'application/json','X-Write-Key':writeKey()},
          body:JSON.stringify({...j.payload,uuid:j.rid||j.uuid,by:myName()})});   // j.rid = fresh idempotency key after an out-of-date-Worker failure; j.uuid (the outbox key) never changes
        const d=await r.json().catch(()=>({}));
        if(d.ok){
          // v5.11: an out-of-date Worker ignores System # but still answers ok. The new Worker lists the
          // Notion fields it wrote — if a System # job comes back without it, don't call it saved.
          // v5.13: same for the replacement dates — every System # / date key sent must come back in d.fields.
          const missing=(/^\/asset-info\//.test(j.path)&&j.payload&&j.payload.set)?Object.keys(ACC_FIELD).filter(k=>j.payload.set[k]!==undefined&&!(Array.isArray(d.fields)&&d.fields.includes(ACC_FIELD[k]))).map(k=>ACC_FIELD[k]):[];
          if(missing.length){
            j.st='failed';j.err=`Worker out of date — ${missing.join(', ')} NOT saved (other fields were). Ask R to update the Cloudflare Worker, then tap Retry.`;j.code=r.status;
            j.hold=true;   // never auto-resent (timer / online / force flushes skip it); retryJob() clears the hold and issues a fresh rid
          }else{j.st='confirmed';j.err='';j.id=d.id;}
        }
        // "Nothing to update" / "Nothing to record" is the Worker saying the
        // patch would change nothing. That is a NO-OP, not a failure — but it
        // came back as a 4xx, so the job parked as 'failed' and sat in the
        // queue for ever showing a scary error. Nothing to do means done.
        else if(NOOP_RE.test(d.error||'')){j.st='confirmed';j.err='';j.noop=true;}
        // v5.11: /site-remark on a Worker that doesn't have the route yet — stay queued, retry on the timer.
        else if(j.path==='/site-remark'&&r.status===404&&/unknown route/i.test(d.error||'')){j.st='queued';j.err='Worker not updated yet for this feature — will retry automatically';j.code=404;}
        else{
          j.st=(r.status>=500||RETRYABLE.has(r.status))?'queued':'failed';
          j.err=d.error||('HTTP '+r.status);
          j.code=r.status;
        }
      }catch(e){ j.st='queued'; j.err='offline / network'; persist(j); break; }
      j.tries=(j.tries||0)+1;
      persist(j);                // persist after every job (merge), including the break above
    }
    // drop confirmed entries older than 3 days
    box=getOutbox().filter(x=>x.st!=='confirmed'||(Date.now()-new Date(x.ts))<3*86400e3);
    setOutbox(box);
    if(getOutbox().every(x=>x.st==='confirmed')) refreshVisits(true);
  } finally{ flushing=false; if(['pm','outbox'].includes(route.p))render(); }
}
function updateSyncBadge(){
  const pend=getOutbox().filter(x=>x.st!=='confirmed');
  const stale=pend.some(j=>jobAgeMs(j)>86400e3);   // anything older than 24h
  const b=$('syncb'); if(!b)return;
  b.textContent=pend.length?`${stale?'⚠️':'⏳'} ${pend.length} pending`:'';
  b.style.color=stale?'var(--warn,#e0533d)':'';
  b.title=stale?'Some entries have been stuck for over a day — open to sync.':'';
}
// Nothing drains the queue while the app is closed (see sw.js), so retry on a
// timer for as long as it IS open — this is what actually rescues a phone that
// regained signal in the user's pocket with the app still in the foreground.
setInterval(()=>{if(getOutbox().some(x=>x.st!=='confirmed'))flushOutbox();},60000);

const getVisits=()=>JSON.parse(localStorage.getItem(VISITS_LS)||'null');
async function refreshVisits(silent){
  if(!workerReady()||!writeKey()||!navigator.onLine)return;
  try{
    const r=await fetch(WORKER_URL+'/visits',{headers:{'X-Write-Key':writeKey()}});
    const d=await r.json();
    if(d.ok){localStorage.setItem(VISITS_LS,JSON.stringify(d));if(!silent&&route.p==='pm')render();}
  }catch(e){}
}

function pmVisits(){
  const need=needIdentity();
  if(need==='setkey'||need==='setname'){$('pmbody').innerHTML=identityCard();return}
  if(need){$('pmbody').innerHTML=`<div class="card"><div class="dim">${esc(need)}</div></div>`;return}
  const cache=getVisits();
  let rows=cache?cache.visits.slice():[];
  // overlay: queued new-visit entries not yet in Notion
  getOutbox().filter(x=>x.st!=='confirmed'&&x.path==='/visit'&&x.method==='POST').forEach(x=>{
    rows.unshift({id:'pending-'+x.uuid,site:x.payload.site,d:x.payload.date,sn:x.payload.sn,item:x.payload.item,type:x.payload.pm_type,pic:x.payload.pic,result:'',findings:'',followup:false});
  });
  if(vPic==='Mine')rows=rows.filter(v=>(v.pic||[]).includes(myName())||String(v.id).startsWith('pending'));

  if(vSt==='Done')rows=rows.filter(v=>v.result);
  rows.sort((a,b)=>(a.d||'9999').localeCompare(b.d||'9999'));
  $('pmbody').innerHTML=`
   <div class="row" style="margin:2px 0 6px"><span class="dim">👤 ${esc(myName())} · <span class="click" style="color:var(--acc)" onclick="localStorage.removeItem('${NAME_LS}');render()">change</span></span>

   <button class="btn" onclick="go('visitnew')">＋ New visit / schedule entry</button>
   ${cache?`<div class="hint">Live schedule as of ${esc(cache.asof.slice(0,16).replace('T',' '))} UTC · ${rows.length} shown</div>`:'<div class="hint">No live data yet — tap ↻ refresh when online.</div>'}

}

function submitNewVisit(abn){
  const date=$('f_date').value, site=$('f_site').value.trim(), sn=$('f_sn').value.trim(), item=$('f_item').value.trim();
  if(!date||!site||(!sn&&!item)){alert('Date, site, and a serial or item name are required.');return}
  const payload={date,site,sn,item,pm_type:$('f_type').value,pic:pickedPics()};
  if(abn){
    payload.result=$('f_res').value;
    payload.findings=$('f_find').value.trim();
    payload.followup=$('f_fu').checked;
    if(!payload.findings){alert('Describe what was abnormal in Findings.');return}
  }
  enqueue('POST','/visit',payload,`${abn?'Abnormal visit':'New visit'} ${site} ${date}`);
  // abnormal visit on a schedule row that was still completed → also tick the schedule
  if(abn&&VN_PRE&&VN_PRE.id&&payload.result.startsWith('Completed')){
    const tk=getTicks(); tk[VN_PRE.id]={by:myName(),ts:Date.now()}; setTicks(tk);
    enqueue('PATCH','/pm/'+VN_PRE.id,{set:{status:'Completed',checked:[myName()]}},`PM done ${site} ${sn||item}`);
  }
  VN_PRE=null;
  go('pm');
}

function submitResult(id){
  const set={result:$('f_res').value,findings:$('f_find').value.trim(),followup:$('f_fu').checked,checked:pickedPics()};

  const c=getVisits(); const v=c&&c.visits.find(x=>x.id===id);
  if(v){Object.assign(v,{result:set.result,findings:set.findings,followup:set.followup});localStorage.setItem(VISITS_LS,JSON.stringify(c));}
  enqueue('PATCH','/visit/'+id,{set},`Result ${v?v.site:''}: ${set.result}`);
  go('pm');
}

// ---- outbox screen ----
function outbox(){
  const box=getOutbox();
  V().innerHTML=`<span class="back" onclick="goBack()">← Back</span><h2>⏳ Sync queue</h2>
   <button class="btn sec" onclick="flushOutbox(true)">↻ Try to sync now</button>
   ${(()=>{const st=box.filter(j=>j.st!=='confirmed'&&jobAgeMs(j)>86400e3).length;
     return st?`<div class="card warn"><b>⚠️ ${st} entr${st===1?'y has':'ies have'} been waiting over 24 hours.</b>
      <div class="dim">Nothing syncs while the app is closed. Stay on Wi-Fi, tap “Try to sync now”, and tell R if anything still says <b>failed</b>.</div></div>`:''})()}
   ${box.slice().reverse().map(j=>`<div class="card${j.st!=='confirmed'?' pend':''}">
     <div class="row"><h3>${esc(j.label)}</h3><span class="tag ${j.st==='confirmed'?'ok':(j.st==='failed'?'bad':'warn')}">${j.st}</span></div>
     <div class="dim">${esc(j.ts.slice(0,16).replace('T',' '))}${j.st!=='confirmed'?' · '+ageLabel(j):''}${j.tries?` · ${j.tries} tr${j.tries===1?'y':'ies'}`:''}</div>
     ${j.err?`<div class="dim" style="color:var(--bad)">${esc(j.err)}${j.code===401||j.code===403?' — write key rejected; R must re-check the Worker key.':''}</div>`:''}
     ${j.st==='failed'?`<button class="btn sm sec" onclick="retryJob('${j.uuid}')">Retry</button><button class="btn sm sec" onclick="dropJob('${j.uuid}')">Delete</button>`:''}
   </div>`).join('')||'<div class=dim style=margin-top:10px>Queue is empty — everything synced.</div>'}`;
}
function ageLabel(j){const h=jobAgeMs(j)/3600e3;
  if(h<1)return Math.max(1,Math.round(h*60))+'m old';
  if(h<48)return Math.round(h)+'h old';
  return Math.round(h/24)+'d old';}
function retryJob(u){const b=getOutbox();const j=b.find(x=>x.uuid===u);if(j){if(j.hold){j.hold=false;j.rid=uid();}   // the old Worker cached the previous idempotency key's reply for 7 days — resend with a fresh one
  j.st='queued';j.err='';setOutbox(b);flushOutbox(true);}render();}
function dropJob(u){setOutbox(getOutbox().filter(x=>x.uuid!==u));render();}

const AN_SECS=[['report','📄 Report'],['overview','Overview'],['sites','Sites'],['people','People'],['problems','Problems'],['rootcause','Root cause'],['quality','Quality']];
const C_SERIES=['var(--acc)','var(--g2)','var(--warn)','#a87bff','#19c2c2','#ff7eb6'];
const anRows=()=>DB.svc.filter(s=>anYear==='All'||(s.d||'').startsWith(anYear));

function tally(rows,acc){const m={};rows.forEach(r=>{let v=acc(r);if(v==null)return;(Array.isArray(v)?v:[v]).forEach(x=>{if(x==null||x==='')return;m[x]=(m[x]||0)+1;});});return Object.entries(m).sort((a,b)=>b[1]-a[1]);}
function shortSite(s){return String(s).replace('Princess Margaret','PMH').replace('Pamela Youde Nethersole Eastern','PYNEH').replace('Queen Elizabeth','QEH').replace('Queen Mary','QMH').replace('Kwong Wah','KWH').replace('Tuen Mun','TMH').replace('United Christian','UCH').replace('Prince of Wales','PWH').replace('North District','NDH').replace('Tseung Kwan O','TKO').replace('Alice Homiu Ling Nethersole','AHNH').replace(/Hospital|Hopsital|Hosptal/,'Hosp.').replace(' Limited','');}
function barSimple(label,val,max,color){const w=max?100*val/max:0;return `<div class="bar-row"><div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(label)}">${esc(label)}</div><div class="bar-track"><div style="width:${w}%;height:100%;background:${color||'var(--acc)'}"></div></div><div class="bar-pct">${val}</div></div>`;}
function barList(pairs,color,limit,short){const top=pairs.slice(0,limit||12);const max=top.length?top[0][1]:1;return top.map(([k,v])=>barSimple(short?shortSite(k):k,v,max,color)).join('')||'<div class=dim>No data.</div>';}
function svgTrend(series){
  if(series.length<2)return '<div class=dim>Not enough data.</div>';
  const W=680,H=170,pad=26,vals=series.map(s=>s[1]),max=Math.max(...vals,1),n=series.length;
  const x=i=>pad+(W-2*pad)*i/(n-1), y=v=>H-20-(H-38)*(v/max);
  const pts=series.map((s,i)=>[x(i),y(s[1])]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=`M${pts[0][0].toFixed(1)} ${H-20} `+pts.map(p=>'L'+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')+` L${pts[n-1][0].toFixed(1)} ${H-20} Z`;
  const step=Math.ceil(n/6);
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" preserveAspectRatio="xMidYMid meet">
    <path d="${area}" fill="rgba(52,209,122,.15)"/><path d="${line}" fill="none" stroke="var(--g2)" stroke-width="2"/>
    ${pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.4" fill="var(--g2)"/>`).join('')}
    ${series.map((s,i)=>i%step===0?`<text x="${x(i).toFixed(1)}" y="${H-5}" font-size="9" fill="var(--dim)" text-anchor="middle">${esc(s[0])}</text>`:'').join('')}
    <text x="2" y="11" font-size="9" fill="var(--dim)">${max}</text></svg>`;
}

// Work owed in month m: excludes N/A statuses AND jobs deferred to a later month
// (they are counted in the month they moved to, not charged twice).
const pmOwed=(PMR,m)=>PMR.filter(x=>pmBucket(x)===m&&!['N/A','Moved'].includes(pmCatOf(x)));
const pmMovedRows=(PMR,m)=>PMR.filter(x=>pmBucket(x)===m&&pmCatOf(x)==='Moved');
const pmDoneN=(PMR,m)=>pmOwed(PMR,m).filter(x=>x.st==='Completed').length;
const cmCount=m=>DB.svc.filter(s=>(s.d||'').startsWith(m)).length;
// {name:{a:assigned,c:completed}} — a compound PIC credits every engineer on the row.
function pmPicStats(PMR,m){
  const o={};
  pmOwed(PMR,m).forEach(x=>(x.pic||[]).forEach(p=>{const e=o[p]=o[p]||{a:0,c:0};e.a++;if(x.st==='Completed')e.c++;}));
  return o;
}
// {name:{t:cases credited,solo:cases attended alone}}
function cmPicStats(m){
  const o={};
  DB.svc.filter(s=>(s.d||'').startsWith(m)).forEach(s=>{const p=s.pic||[];p.forEach(n=>{const e=o[n]=o[n]||{t:0,solo:0};e.t++;if(p.length===1)e.solo++;});});
  return o;
}
// ties share a rank (1,1,3…). `tie` = optional secondary sort key (desc); default keeps the Report's order.
const rankTies=(arr,val,tie)=>{arr.sort((a,b)=>val(b)-val(a)||(tie?tie(b)-tie(a):(b.c||0)-(a.c||0)));
  arr.forEach((r,i)=>{r.rank=(i&&val(r)===val(arr[i-1]))?arr[i-1].rank:i+1;});return arr;};
// CM stats {name:{t,solo}} → ranked rows; share = of all credits in the stats (so the column totals 100%)
function cmRankRows(st){
  const rows=Object.entries(st).map(([n,v])=>({n,c:v.t,solo:v.solo,w:v.t-v.solo}));
  const tot=rows.reduce((a,r)=>a+r.c,0);
  rows.forEach(r=>r.pct=tot?Math.round(100*r.c/tot):0);
  return rankTies(rows,r=>r.c);

// PM stats {name:{a,c}} → ranked rows by completed (Report order); People passes tie=r=>r.pct for completed-then-rate

  const per={},pairs={};
  withPic.forEach(s=>{const p=s.pic;p.forEach(n=>{per[n]=per[n]||{t:0,s:0};per[n].t++;if(p.length===1)per[n].s++;});
    for(let i=0;i<p.length;i++)for(let j=i+1;j<p.length;j++){const k=[p[i],p[j]].sort().join(' & ');pairs[k]=(pairs[k]||0)+1;}});
  const perArr=Object.entries(per).map(([n,v])=>({n,t:v.t,s:v.s,c:v.t-v.s,pct:Math.round(100*v.s/v.t)})).filter(x=>x.t>=3).sort((a,b)=>b.pct-a.pct||b.t-a.t);
  const pairArr=Object.entries(pairs).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const counts=tally(rows,s=>s.pic);
  const solo=withPic.filter(s=>s.pic.length===1).length, tot=withPic.length, soloPct=tot?Math.round(100*solo/tot):0;
  const top=perArr[0], low=[...perArr].sort((a,b)=>a.pct-b.pct||b.t-a.t)[0];
  $('ansec').innerHTML=monthly+`
   <div class="card"><h3>CM count by engineer (PIC) — ${anYear==='All'?'all time':anYear}</h3>${barList(counts,'var(--acc)',14)}</div>
   <div class="kpis"><div class="kpi"><div class="n g">${soloPct}%</div><div class="l">Tickets handled solo</div></div>
     <div class="kpi"><div class="n">${100-soloPct}%</div><div class="l">Tickets needing 2+ people</div></div></div>
   <div class="card"><h3>Solo vs. collaborative, by engineer</h3>
     <div class="dim" style="margin-bottom:6px">Sorted by solo %, high→low · ≥3 tickets</div>
     <div class="legend"><span><span class="dot" style="background:var(--solo)"></span>Solo</span><span><span class="dot" style="background:var(--collab)"></span>Collaborative</span></div>
     ${perArr.map(x=>hbar(x.n,x.s,x.c,x.pct)).join('')||'<div class=dim>No data.</div>'}</div>
   <div class="card"><h3>Top collaboration pairs</h3><table><tr><th>Pair</th><th style="text-align:right">Together</th></tr>
     ${pairArr.map(([k,v])=>`<tr><td>${esc(k)}</td><td style="text-align:right">${v}</td></tr>`).join('')}</table></div>
   ${top&&low?`<div class="insight"><b>${esc(top.n)}</b> is the most independent this period (${top.pct}% solo, ${top.t} tickets); <b>${esc(low.n)}</b> is almost always paired (${low.pct}% solo). <span class="hint">Case-mix caveat: solo % reflects ticket types, not ability.</span></div>`:''}`;
}
function anProblems(){
  const rows=anRows();
  $('ansec').innerHTML=`
   <div class="card"><h3>Problem types (${anYear==='All'?'all time':anYear})</h3>${barList(tally(rows,s=>s.pt),'var(--warn)',12)}</div>
   <div class="card"><h3>CM by machine model</h3>${barList(tally(rows,s=>s.mach),'var(--g2)',12)}</div>
   <div class="card"><h3>Top symptoms</h3>${barList(tally(rows,s=>s.sym),'#a87bff',12)}</div>`;
}
function anRoot(){
  const rows=anRows();
  $('ansec').innerHTML=`
   <div class="card"><h3>Error codes (${anYear==='All'?'all time':anYear})</h3>
     <div class="dim" style="margin-bottom:6px">Look them up in Fix › Error Codes</div>${barList(tally(rows,s=>s.err),'var(--warn)',15)}</div>
   <div class="card"><h3>Root cause — Problem L2</h3>${barList(tally(rows,s=>s.l2),'var(--acc)',15)}</div>
   <div class="card"><h3>Most-used replacement parts</h3>${barList(tally(rows,s=>s.parts),'var(--g2)',15)}</div>`;
}
function anQuality(){
  const rows=anRows();
  const monthly=tally(DB.svc,s=>(s.d||'').slice(0,7)).filter(x=>x[0]).sort((a,b)=>a[0].localeCompare(b[0]));
  const q=monthly.slice(-3);
  const topSite=tally(rows,s=>s.site)[0], topMach=tally(rows,s=>s.mach).slice(0,2), topProb=tally(rows,s=>s.pt).slice(0,2);
  let revHtml;
  if(hasRv()){
    const rv=DB.svc.filter(s=>s.rv==='Revisited');
    const rvRows=rows.filter(s=>s.rv==='Revisited');
    const rate=(rv.length/DB.svc.length*100).toFixed(1);
    revHtml=`<div class="kpis" style="grid-template-columns:repeat(2,1fr)">
       <div class="kpi"><div class="n" style="color:var(--bad)">${rv.length}</div><div class="l">Total revisits (7-day, same S/N + symptom)</div></div>
       <div class="kpi"><div class="n a">${rate}%</div><div class="l">Revisit rate, all-time</div></div></div>
     <div class="card"><h3>Revisit symptoms (${anYear==='All'?'all time':anYear})</h3>${barList(tally(rvRows,s=>s.sym),'var(--bad)',10)}</div>`;
  }else{
    revHtml=`<div class="card"><h3>Revisits within 7 days</h3><div class="insight" style="border-left-color:var(--warn)">This chart activates on the next nightly rebuild — the exact <b>“Revisited within 7 days (same symptoms)”</b> field was just added to <code>pull_notion.py</code>. Until then it isn't in this offline snapshot. (Rule: same S/N + same symptoms within 7 days.)</div></div>`;
  }
  $('ansec').innerHTML=`
   ${revHtml}
   <div class="card"><h3>Last 3 months — CM volume</h3><table><tr><th>Month</th><th style="text-align:right">CM records</th></tr>
     ${q.map(([m,v])=>`<tr><td>${m}</td><td style="text-align:right">${v}</td></tr>`).join('')}</table></div>
   <div class="card"><h3>Key takeaways (${anYear==='All'?'all time':anYear})</h3>
     ${topSite?`<div class="insight"><b>Demand:</b> ${esc(topSite[0])} is the highest-demand site (${topSite[1]} CM records). ${topMach.length?`Machines ${topMach.map(m=>esc(m[0])+' ('+m[1]+')').join(' + ')} dominate the workload.`:''}</div>`:''}
     ${topProb.length?`<div class="insight"><b>Failure modes:</b> ${topProb.map(p=>esc(p[0])+' ('+p[1]+')').join(' and ')} are the top problem categories — feed these back into SOP / checklists.</div>`:''}
     <div class="hint">Numbers computed live from the offline snapshot; consistent with the CM 數據分析 page.</div></div>
   <div class="sys">Browse records</div>
   <input type=search id=q placeholder="Filter by site / L2 / serial / PIC…" oninput="histSearch()"><div id=list></div>`;
  histSearch();
}
function hbar(label,solo,collab,pct){
  const tot=solo+collab||1, sp=100*solo/tot, cp=100*collab/tot;
  return `<div class="bar-row"><div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(label)}</div>
    <div class="bar-track" title="${solo} solo / ${collab} collab">
      <div class="bar-solo" style="width:${sp}%"></div><div class="bar-collab" style="width:${cp}%"></div>
    </div><div class="bar-pct">${pct}%</div></div>`;
}
function histSearch(){
  const q=($('q')?.value||'').toLowerCase();
  const rec=DB.svc.filter(s=>!q||(s.site+' '+s.l2+' '+(s.sn||[]).join(' ')+' '+(s.sym||[]).join(' ')+' '+(s.pic||[]).join(' ')).toLowerCase().includes(q))
    .sort((a,b)=>b.d.localeCompare(a.d)).slice(0,30);
  $('list').innerHTML=rec.map(svcLine).join('')+`<div class="hint">Latest ${rec.length} shown. Full records live in Notion.</div>`;
}

// ---- V4: iOS install banner + sync triggers ----
(function(){
  const isIOS=/iPhone|iPad|iPod/.test(navigator.userAgent);
  const standalone=navigator.standalone===true||matchMedia('(display-mode: standalone)').matches;
  if(isIOS&&!standalone&&!localStorage.getItem('fw_iosbn')){
    const d=document.createElement('div'); d.id='iosbanner';
    d.innerHTML=`📲 <b>Install as an app:</b> tap <b>Share</b> → <b>Add to Home Screen</b>. Then open it from the icon and enter the password once — it works offline after that. <span style="color:var(--acc);cursor:pointer" onclick="localStorage.setItem('fw_iosbn','1');this.parentNode.remove()">Dismiss</span>`;
    document.body.insertBefore(d,document.querySelector('main'));
  }
})();
window.addEventListener('online',flushOutbox);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){flushOutbox();refreshVisits(true);}});

if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
tryRemembered();
</script>
